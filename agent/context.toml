# Pages Eldgrim reads. The model does not choose them.
# A page named in the core and again in a task is loaded once, with the core.
# The core is always read whole. A task may name the ## sections it reads from a page:
# { page = "...", sections = ["Heading", ...] }. It then gets the page's opening, before
# the first ## heading, and those sections in page order. A heading the page does not
# have stops the run. "Refinement queue" sections hold open questions and are left out.
# A page listed twice in the same list is an error.
# Future tasks stay comments so nothing can load them yet.

[core]
pages = [
  "character/SELF.md",
  "character/PROFILE.md",
  "character/VOICE.md",
  "lore/AMBERHEARTH.md",
  "lore/FIRES_AND_SYMBOLS.md",
  "interaction/PRINCIPLES.md",
  "governance/01-established-foundation.md",
  "governance/02-identity-and-purpose.md",
  "governance/15-proposed-priority-hierarchy.md",
  "agent/CAPABILITIES.md",
]
# The guild list is not part of the core. The proclamation asks for it. A quest or a
# reply receives one character, built at run time, and does not read the rest of the guild.

[task.proclamation]
pages = [
  { page = "governance/03-social-rules.md", sections = [
    "Confirmed member protections — questions 13–20",
  ] },
  { page = "governance/06-daily-conduct-and-communication.md", sections = [
    "Confirmed operating cadence — question 90",
    "Confirmed communication and decision quotas — questions 91–99",
  ] },
  { page = "governance/08-quests-recognition-and-rewards.md", sections = [
    "Purpose and creative direction",
    "The daily quest",
    "Deadlines and rewards (Q109–110)",
  ] },
  { page = "governance/09-sunday-gatherings.md", sections = [
    "Traveling fires",
    "Confirmed decisions — questions 111–115",
    "Member-organized activities — question 157",
  ] },
  # One invitation to the whole guild: the objects anyone can bring, not the gear lists.
  { page = "lore/FIRE_ITEMS.md", sections = [
    "What Eldgrim may ask",
    "Small flames",
    "Campfires, and what can be laid beside them",
    "For one evening",
  ] },
  "lore/WORLD.md",
]
people = true
private_origin = true
num_ctx = 28672
num_predict = 500

